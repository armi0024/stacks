[project]
name = "stacks"
version = "0.1.0"
description = "Stacks: universal personal library & estate document substrate (SPEC v1.5.1)"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
]

[project.scripts]
stacks-analyze = "stacks.analyzer.cli:main"
stacks-admin = "stacks.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stacks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
